# Ambiente local reproduzível da proposta DiversCape (WordPress, quatro idiomas).
# Não usar em produção sem rever credenciais, volumes e envio de email.
name: diverscape

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-diverscape-local}
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-staging}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', getenv_docker( 'WP_ENVIRONMENT_TYPE', 'staging' ) );
    define( 'DISALLOW_FILE_EDIT', true );
    define( 'WP_POST_REVISIONS', 20 );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_DEBUG_LOG', '/tmp/wp-debug.log' );

x-wp-volumes: &wp-volumes
  - wp:/var/www/html
  - ./wp-content/themes/diverscape:/var/www/html/wp-content/themes/diverscape
  - ./wp-content/plugins/diverscape-core:/var/www/html/wp-content/plugins/diverscape-core
  - ./wp-content/plugins/diverscape-demo-mode:/var/www/html/wp-content/plugins/diverscape-demo-mode
  - ./config/php.ini:/usr/local/etc/php/conf.d/diverscape.ini:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-diverscape-local}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8093}:80"
    environment:
      <<: *wp-env
      DVS_SMTP_HOST: mailpit
    volumes: *wp-volumes

  # Captura qualquer email gerado localmente; nada sai para a Internet.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8029}:8025"

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      DVS_SMTP_HOST: mailpit
    volumes:
      - wp:/var/www/html
      - ./wp-content/themes/diverscape:/var/www/html/wp-content/themes/diverscape
      - ./wp-content/plugins/diverscape-core:/var/www/html/wp-content/plugins/diverscape-core
      - ./wp-content/plugins/diverscape-demo-mode:/var/www/html/wp-content/plugins/diverscape-demo-mode
      - ./config/php.ini:/usr/local/etc/php/conf.d/diverscape.ini:ro

volumes:
  db:
  wp:
